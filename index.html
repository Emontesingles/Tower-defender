<style>

function distract(c,lv){
  const b=BASE[c];
  if(c==='better')return['gooder','more good'];if(c==='worse')return['badder','more bad'];if(c==='farther')return['farer','more far'];

  if(lv>=2&&c!=='drier'){
    if(/ier$/.test(c))w=b+'er';
    else if(/([bdgmnpt])\1er$/.test(c))w=c.replace(/(.)\1er$/,'$1er');
    else if(/e$/.test(b)&&c===b+'r')w=b+'er';
  }
  return[sup,w];
}
